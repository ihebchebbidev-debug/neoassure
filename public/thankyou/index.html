<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Merci — NEOASSUR</title>
    <meta
      name="description"
      content="Merci ! Votre demande a bien été envoyée. Nous vous rappelons rapidement."
    />

    <!-- Meta tracking is handled by the form after cookie consent -->

    <style>
      body {
        font-family:
          Inter,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          "Helvetica Neue",
          Arial,
          "Noto Sans",
          sans-serif;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #f8fafc;
        color: #0f172a;
        padding: 16px;
      }
      .card {
        max-width: 640px;
        width: 100%;
        padding: 40px 32px;
        text-align: center;
        background: white;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(2, 6, 23, 0.08);
      }
      .icon {
        width: 64px;
        height: 64px;
        background: #dcfce7;
        color: #16a34a;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        font-size: 32px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        font-weight: 700;
      }
      p {
        margin: 0 0 24px;
        font-size: 16px;
        color: #475569;
        line-height: 1.6;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }
      .btn {
        display: inline-block;
        padding: 12px 24px;
        background: #ef4444;
        color: white;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
      }
      .btn-outline {
        display: inline-block;
        padding: 12px 24px;
        background: white;
        color: #0f172a;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">✓</div>
      <h1>Merci !</h1>
      <p>
        Votre demande de devis a bien été envoyée. Un conseiller expert vous rappelle rapidement et
        gratuitement.
      </p>
      <div class="actions">
        <a class="btn" href="/">Retour à l'accueil</a>
        <a class="btn-outline" href="tel:+33187665610">Appeler le 01 87 66 56 10</a>
      </div>
    </div>
  </body>
</html>
